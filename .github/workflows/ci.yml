name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run fixtures
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python ivcli.py fixtures/clean.uibc; test $? -eq 2
          python ivcli.py fixtures/tampered.uibc; test $? -eq 1
