name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run fixtures
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" -v
          test $? -eq 0 || exit 1
          python ivcli.py fixtures/clean.uibc; code=$?; echo "clean -> $code"; test $code -eq 2 || exit 1
          python ivcli.py fixtures/tampered.uibc; code=$?; echo "tampered -> $code"; test $code -eq 1 || exit 1
          python ivcli.py fixtures/malicious-keyswap.uibc; code=$?; echo "keyswap -> $code"; test $code -eq 2 || exit 1
          python ivcli.py fixtures/does-not-exist; code=$?; echo "missing -> $code"; test $code -eq 3 || exit 1
